name: Build & Publish Tachyon Lists

on:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "build_lists.py"
      - "custom/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build unified lists and SRS rule-sets
        run: python3 build_lists.py

      - name: Commit updated release artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(lists): auto-update unified rulesets ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:main
          fi

      - name: Publish latest GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/sing-box/*.srs release/tachyon/*.trs release/catalog.json --clobber
          else
            gh release create "$TAG" release/sing-box/*.srs release/tachyon/*.trs release/catalog.json \
              --title "Tachyon Lists (Latest)" \
              --notes "Auto-updated unified rule-sets (.trs v2 / .srs) and domain/subnet lists for Tachyon."
          fi
