<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Карта апстрим-источников Tachyon Lists</title>
  <desc id="desc">Схема 8 внешних апстрим-репозиториев и локального слоя custom/, формирующих категории маршрутизации Tachyon Lists.</desc>

  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#0B111D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#map-bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="40" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Карта апстрим-источников (sources.json)</text>
  <text x="40" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">Каждая категория агрегирует сразу несколько независимых репозиториев для полноты охвата доменов и CIDR-подсетей</text>

  <!-- Row 1: 3 Cards -->
  <g transform="translate(36, 96)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">itdoginfo/allow-domains</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Релизные .srs + Subnets IPv4/IPv6</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">russia_inside, geoblock, block, соцсети,</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Cloudflare, CloudFront, Hetzner, OVH, DO</text>
  </g>

  <g transform="translate(418, 96)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">runetfreedom/russia-v2ray-*</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">russia-v2ray-rules-dat + blocked-geoip</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">ru_blocked, ru_blocked_all, antifilter,</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">refilter, ru_only_inside, ИИ, медиа, игры</text>
  </g>

  <g transform="translate(800, 96)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">hydraponique/roscomvpn-*</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">roscomvpn-geosite + roscomvpn-geoip</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">ru_whitelist, ru_domains, push, twitch_ads,</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">torrent, win_spy, EFT, FACEIT, Origin</text>
  </g>

  <!-- Row 2: 3 Cards -->
  <g transform="translate(36, 250)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">MetaCubeX/meta-rules-dat</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Ветка sing (geosite &amp; geoip JSON v3)</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Глобальные базы OpenAI, Anthropic, xAI,</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Steam, Apple, Microsoft, geoip_ru/us/cn</text>
  </g>

  <g transform="translate(418, 250)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#FB7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">zxc-rv/ad-filter &amp; ushan0v</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Специализированные .srs наборы</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• zxc-rv/ad-filter (Hagezi Multi PRO)</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• ushan0v/sing-box-supercell-ruleset</text>
  </g>

  <g transform="translate(800, 250)">
    <rect x="0" y="0" width="364" height="136" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="30" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">custom/ (локальные поправки)</text>
    <text x="18" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600">Ручная коррекция перед сборкой</text>
    <text x="18" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• custom/domains/&lt;id&gt;.lst и subnets/</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• custom/exclude/&lt;id&gt;.lst (исключения)</text>
  </g>
</svg>
