<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="410" viewBox="0 0 1200 410"
     role="img" aria-labelledby="title desc">
  <title id="title">Tachyon Lists — единый компилятор списков маршрутизации, доменов и подсетей</title>
  <desc id="desc">Автоматизированная сборка, дедупликация и компиляция списков маршрутизации из 8 апстрим-источников в форматы sing-box SRS v3, JSON, плоские списки доменов и агрегированные IPv4/IPv6 CIDR-подсети для OpenWrt.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="55%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#0B111C"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="410" rx="22" fill="url(#bg-grad)"/>
  <rect width="1200" height="410" rx="22" fill="url(#tech-grid)"/>
  <rect x="1" y="1" width="1198" height="408" rx="21" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Rule -->
  <rect x="48" y="0" width="360" height="3" rx="1.5" fill="url(#accent-line)"/>

  <!-- LEFT: Title & Identity Block -->
  <g id="title-block" transform="translate(48, 38)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="446" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#38BDF8"/>
    <text x="32" y="21" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">TACHYON ROUTING ENGINE · AUTO-BUILD 6H</text>

    <!-- Repository Name -->
    <text x="0" y="88" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">tachyon-lists</text>

    <!-- Value Proposition -->
    <text x="0" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400">Единый мульти-источниковый компилятор и дедупликатор</text>
    <text x="0" y="158" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400">списков доменов и IP-подсетей для роутеров OpenWrt.</text>

    <!-- Target Stack Badges -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="116" height="34" rx="7" fill="#111C2D" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45"/>
      <text x="58" y="22" text-anchor="middle" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">sing-box</text>

      <rect x="126" y="0" width="150" height="34" rx="7" fill="#111C2D" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45"/>
      <text x="201" y="22" text-anchor="middle" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">tachyon-core</text>

      <rect x="286" y="0" width="84" height="34" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="328" y="22" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">steer</text>

      <rect x="380" y="0" width="102" height="34" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="431" y="22" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">zapret2</text>

      <rect x="492" y="0" width="110" height="34" rx="7" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="547" y="22" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">nftables</text>
    </g>

    <!-- Key Metrics Strip -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="190" height="62" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
      <text x="16" y="26" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">8 апстримов</text>
      <text x="16" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">+ слой custom/</text>

      <rect x="204" y="0" width="190" height="62" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
      <text x="220" y="26" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">61 категория</text>
      <text x="220" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">56 в каталоге + 5 sys</text>

      <rect x="408" y="0" width="194" height="62" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2"/>
      <text x="424" y="26" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">RAM Pruned</text>
      <text x="424" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">суффиксы и CIDR</text>
    </g>

    <!-- Routing Mode Legend -->
    <g transform="translate(0, 320)">
      <circle cx="10" cy="10" r="6" fill="#A855F7"/>
      <text x="24" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Proxy</text>
      <text x="78" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">(обход блокировок)</text>

      <circle cx="262" cy="10" r="6" fill="#10B981"/>
      <text x="276" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Direct</text>
      <text x="334" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">(напрямую в РФ)</text>

      <circle cx="496" cy="10" r="6" fill="#F43F5E"/>
      <text x="510" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Block</text>
      <text x="562" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">(реклама)</text>
    </g>
  </g>

  <!-- RIGHT: Real Project Architecture Specimen -->
  <g id="project-proof" transform="translate(684, 32)">
    <rect x="0" y="0" width="472" height="346" rx="16" fill="#0B111D" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="472" height="40" rx="16" fill="#111A2B"/>
    <rect x="0" y="24" width="472" height="16" fill="#111A2B"/>
    <circle cx="22" cy="20" r="5" fill="#F43F5E"/>
    <circle cx="38" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="20" r="5" fill="#10B981"/>
    <text x="76" y="25" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">sources.json → build_lists.py → release/</text>

    <!-- Stage 1: Upstreams -->
    <g transform="translate(20, 54)">
      <rect x="0" y="0" width="432" height="72" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="25" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">1. ВХОДНЫЕ АПСТРИМЫ (8 РЕПОЗИТОРИЕВ)</text>
      <text x="14" y="47" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">roscomvpn · runetfreedom · allow-domains</text>
      <text x="14" y="65" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">MetaCubeX · ad-filter · supercell · custom/</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 236 126 L 236 144" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="231,141 241,141 236,148" fill="#38BDF8"/>

    <!-- Stage 2: Optimization Core -->
    <g transform="translate(20, 148)">
      <rect x="0" y="0" width="432" height="82" rx="10" fill="#111C2D" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="14" y="25" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">2. ОПТИМИЗАТОР ДЕРЕВА (optimize_bucket)</text>
      <text x="14" y="48" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• Срезка поддоменов под domain_suffix</text>
      <text x="14" y="70" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">• Схлопывание CIDR + защита DNS sing-box 1.14+</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 236 230 L 236 248" stroke="#10B981" stroke-width="2"/>
    <polygon points="231,245 241,245 236,252" fill="#10B981"/>

    <!-- Stage 3: Output Artifacts -->
    <g transform="translate(20, 252)">
      <rect x="0" y="0" width="210" height="76" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="25" fill="#E9D5FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">sing-box / json</text>
      <text x="14" y="47" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">release/sing-box/*.srs</text>
      <text x="14" y="66" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">release/json/*.json</text>

      <rect x="222" y="0" width="210" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
      <text x="236" y="25" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">domains / subnets</text>
      <text x="236" y="47" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">release/domains/*.lst</text>
      <text x="236" y="66" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">subnets/{ipv4,ipv6}/*.lst</text>
    </g>
  </g>
</svg>
