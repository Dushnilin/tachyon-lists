<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">tachyon-lists — компилятор и дедупликатор списков маршрутизации</title>
  <desc id="desc">Автоматическая сборка, дедупликация и компиляция 143 категорий доменов и IPv4/IPv6 подсетей из внешних апстримов в форматы TSRS v2 (.trs), sing-box (.srs, .json) и текстовые списки (.lst) каждые 6 часов.</desc>

  <!-- Canvas -->
  <rect width="1200" height="400" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Left column: identity, stack, metrics -->
  <g transform="translate(40, 40)">
    <!-- Status tag -->
    <rect x="0" y="0" width="320" height="28" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">tachyon routing lists · auto-build 6h</text>

    <!-- Title & description -->
    <text x="0" y="76" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-1">tachyon-lists</text>
    <text x="0" y="112" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">Единый компилятор и дедупликатор списков доменов</text>
    <text x="0" y="136" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">и IP-подсетей для роутеров OpenWrt и десктопных клиентов</text>

    <!-- Target engines -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="124" height="32" rx="6" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="62" y="20" text-anchor="middle" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">tachyon-core</text>

      <rect x="132" y="0" width="96" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="180" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">sing-box</text>

      <rect x="236" y="0" width="76" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="274" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">steer</text>

      <rect x="320" y="0" width="88" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="364" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">zapret2</text>

      <rect x="416" y="0" width="96" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="464" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">nftables</text>
    </g>

    <!-- Stat cards (same height 68px, 4px grid) -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">143</text>
      <text x="60" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">категории</text>
      <text x="16" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">138 основных + 5 sys</text>

      <rect x="196" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="212" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">8</text>
      <text x="232" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">апстримов</text>
      <text x="212" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">+ локальный custom/</text>

      <rect x="392" y="0" width="192" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="408" y="28" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">TSRS v2</text>
      <text x="408" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">zero-copy mmap + .srs</text>
    </g>

    <!-- Routing action legend -->
    <g transform="translate(0, 304)">
      <circle cx="6" cy="8" r="4" fill="#38bdf8"/>
      <text x="18" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Proxy</text>
      <text x="64" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">внешний туннель</text>

      <circle cx="204" cy="8" r="4" fill="#4cc38a"/>
      <text x="216" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Direct</text>
      <text x="266" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">напрямую в РФ</text>

      <circle cx="388" cy="8" r="4" fill="#e5484d"/>
      <text x="400" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Block</text>
      <text x="446" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">реклама и телеметрия</text>
    </g>
  </g>

  <!-- Right column: live compilation specimen -->
  <g transform="translate(664, 32)">
    <rect x="0" y="0" width="496" height="336" rx="12" fill="#0f0f10" stroke="#2e2e32" stroke-width="1"/>

    <!-- Specimen header -->
    <rect x="0" y="0" width="496" height="36" rx="12" fill="#19191b"/>
    <rect x="0" y="24" width="496" height="12" fill="#19191b"/>
    <line x1="0" y1="36" x2="496" y2="36" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="23" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">sources.json → build_lists.py → release/</text>
    <text x="480" y="23" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">6h cron</text>

    <!-- Stage 1 -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="464" height="72" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">1. Слияние апстримов и локальных списков</text>
      <text x="448" y="24" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">16 потоков</text>
      <text x="16" y="44" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">allow-domains · runetfreedom · roscomvpn · MetaCubeX</text>
      <text x="16" y="60" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">ad-filter · supercell · custom/{domains,subnets,exclude}</text>
    </g>

    <!-- Connector 1 -->
    <line x1="248" y1="124" x2="248" y2="140" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 2 (highlighted moment) -->
    <g transform="translate(16, 140)">
      <rect x="0" y="0" width="464" height="80" rx="8" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">2. Оптимизация дерева правил (optimize_bucket)</text>
      <text x="448" y="24" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">RAM pruning</text>
      <text x="16" y="46" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Отсечение поддоменов, перекрытых родительским суффиксом</text>
      <text x="16" y="64" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Схлопывание смежных CIDR и разделение DNS/IP для sing-box 1.14+</text>
    </g>

    <!-- Connector 2 -->
    <line x1="248" y1="220" x2="248" y2="236" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 3 -->
    <g transform="translate(16, 236)">
      <rect x="0" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Бинарные наборы</text>
      <text x="16" y="46" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">release/tachyon/*.trs</text>
      <text x="16" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">release/sing-box/*.srs</text>

      <rect x="238" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="254" y="24" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Текстовые списки и JSON</text>
      <text x="254" y="46" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">domains/*.lst · subnets/*.lst</text>
      <text x="254" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">json/*.json · catalog.json</text>
    </g>
  </g>
</svg>
