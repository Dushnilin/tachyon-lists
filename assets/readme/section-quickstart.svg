<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="84" viewBox="0 0 1200 84"
     role="img" aria-labelledby="title desc">
  <title id="title">01 — Быстрый старт и форматы артефактов</title>
  <desc id="desc">Раздел быстрого старта и подключения готовых списков маршрутизации в sing-box, tachyon-core, steer, zapret2 и nftables.</desc>
  <defs>
    <linearGradient id="sec1-bg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="84" rx="14" fill="url(#sec1-bg)"/>
  <rect x="1" y="1" width="1198" height="82" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="18" width="5" height="48" rx="2.5" fill="#38BDF8"/>
  <rect x="28" y="22" width="68" height="40" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="62" y="48" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">01</text>
  <text x="116" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">БЫСТРЫЙ СТАРТ И ВЫХОДНЫЕ ФОРМАТЫ (RELEASE/)</text>
  <text x="116" y="66" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Готовые артефакты для sing-box v3 (.srs / .json), steer, zapret2, dnsmasq (.lst) и nftables (IPv4/IPv6 CIDR)</text>
</svg>
