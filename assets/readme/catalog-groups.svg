    <text x="18" y="84" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">telegram (домены + DC1–DC5 CIDR)</text>
    <text x="18" y="108" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">meta · twitter</text>
    <text x="18" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Звонки, голосовые шлюзы и медиа-серверы</text>
  </g>

