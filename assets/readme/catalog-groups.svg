    <text x="315" y="29" text-anchor="middle" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Proxy</text>
    <text x="18" y="60" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">apple · microsoft · google_play</text>
    <text x="18" y="84" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">github · docker · hodca</text>
    <text x="18" y="108" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">cloudflare · cloudfront · fastly</text>
    <text x="18" y="130" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">hetzner · ovh · digitalocean</text>
  </g>

  <!-- Group 8: Other & Block -->
  <g transform="translate(416, 342)">
    <rect x="0" y="0" width="368" height="142" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="18" y="30" fill="#FECDD3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Торренты, Tor и Блок (6)</text>
    <rect x="248" y="12" width="104" height="24" rx="6" fill="#31101E"/>
    <text x="300" y="29" text-anchor="middle" fill="#FB7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">Proxy/Block</text>
    <text x="18" y="60" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">news · torrent · tor · porn</text>
    <text x="18" y="88" fill="#FB7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">ads_hagezi_pro (210,918 доменов)</text>
    <text x="18" y="112" fill="#FB7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">win_spy (телеметрия Windows)</text>
    <text x="18" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Трекеры, мосты Tor, Hagezi Pro и слежка ОС</text>
  </g>

  <!-- Group 9: Internal System -->
  <g transform="translate(804, 342)">
    <rect x="0" y="0" width="368" height="142" rx="12" fill="#0F172A" stroke="#64748B" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.7"/>
    <text x="18" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Системные гео-базы (5)</text>
