    <rect x="278" y="12" width="74" height="24" rx="6" fill="#26143B"/>
    <text x="315" y="29" text-anchor="middle" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Proxy</text>
    <text x="18" y="60" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">steam · epicgames · riot</text>
    <text x="18" y="84" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">origin · roblox · supercell</text>
    <text x="18" y="108" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">escapefromtarkov · faceit</text>
    <text x="18" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Матчмейкинг, античиты, голосовой чат и CDN</text>
  </g>

  <!-- ROW 3 -->
  <!-- Group 7: Tech & Cloud/CDN -->
  <g transform="translate(28, 342)">
    <rect x="0" y="0" width="368" height="142" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.55"/>
