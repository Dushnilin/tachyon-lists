<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="510" viewBox="0 0 1200 510"
     role="img" aria-labelledby="title desc">
  <title id="title">Витрина 143 категорий списков маршрутизации по группам</title>
  <desc id="desc">Сетка из 9 тематических групп каталога Tachyon Lists: Региональные и РКН (10), Прямой маршрут Direct (6), Нейросети и ИИ (15), Видео, музыка и медиа (17), Соцсети, мессенджеры и звонки (10), Игры и лаунчеры (33), Разработка, CDN и облака (29), Финтех, Крипта, P2P и Блок (18), Системные базы (5).</desc>

  <defs>
