<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="title desc">
  <title id="title">Витрина 150 категорий списков маршрутизации по 11 группам</title>
  <desc id="desc">Сетка из 11 тематических групп каталога tachyon-lists (145 основных и 5 системных категорий): Региональные маршруты (10), Прямой маршрут Direct (6), Нейросети и ИИ (17), Видео, музыка и медиа (18), Соцсети и звонки (10), Игры и лаунчеры (33), Разработка и сервисы (21), CDN, DNS и облака (9), Финтех, СМИ и сервисы (11), Фильтр рекламы и угроз (10), Системные гео-базы (5).</desc>

  <rect width="1200" height="640" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

