    <text x="18" y="30" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Видео, музыка и медиа (9)</text>
    <rect x="278" y="12" width="74" height="24" rx="6" fill="#26143B"/>
    <text x="315" y="29" text-anchor="middle" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">Proxy</text>
    <text x="18" y="60" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">youtube · twitch · twitch_ads</text>
    <text x="18" y="84" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">spotify · netflix · tiktok</text>
    <text x="18" y="108" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">hdrezka · anime · pinterest</text>
    <text x="18" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">GGC-кэши, стриминг без рекламы и CDN</text>
