    <text x="18" y="84" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">geoip_ru · geoip_cn (Direct)</text>
    <text x="18" y="108" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">geoip_us (Proxy)</text>
    <text x="18" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Системные таблицы маршрутизации Tachyon</text>
